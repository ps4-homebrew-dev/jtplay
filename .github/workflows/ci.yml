name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install toolchain
        run: |
          wget https://github.com/ps4-homebrew-dev/pacbrew/releases/latest/download/ps4-homebrew-dev.tar.gz
          sudo tar xf ps4-homebrew-dev.tar.gz -C /

      - name: Checkout Homebrew
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-20 lld-20 llvm-20

      - name: Build Homebrew
        run: |
          /opt/ps4-homebrew-sdk/bin/orbis-cmake -S . -B build
          make -C build

      - name: Upload Homebrew
        uses: actions/upload-artifact@v4
        with:
          name: Homebrew
          path: "build/*.pkg"
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: Homebrew
          path: .

      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: true
          files: "*.pkg"
